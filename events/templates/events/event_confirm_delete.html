
{% extends "base.html" %}

{% block title %}Delete Event - EventHub{% endblock %}

{% block content %}

<h2>Delete Event</h2>

<p>Are you sure you want to delete this event?</p>

<h3>{{ event.title }}</h3>

<p>Organization: {{ event.organization_name }}</p>

<form method="POST">
    {% csrf_token %}

    <button type="submit">Yes, Delete</button>

    <a href="{% url 'events:event_list' %}">
        Cancel
    </a>
</form>

{% endblock %}
