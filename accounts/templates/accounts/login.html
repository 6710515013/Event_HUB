<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Event Hub - Login</title>
</head>
<body>
    <h1>Event Hub</h1>
    <h2>Login</h2>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Login</button>
    </form>

    <p>
        Don't have an account?
        <a href="/accounts/register/">Register</a>
    </p>
</body>
</html>
